<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Neokred cybersecurity project">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05160b"/><stop offset="1" stop-color="#06222b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2cd626"/><stop offset="1" stop-color="#19e3c5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#2cd626" stop-opacity="0.4"/><stop offset="1" stop-color="#2cd626" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hex" width="56" height="48" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M14 0 L42 0 L56 24 L42 48 L14 48 L0 24 Z" fill="none" stroke="#2cd626" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="640" fill="url(#bg)"/>
  <rect width="800" height="640" fill="url(#hex)"/>
  <circle cx="400" cy="290" r="260" fill="url(#glow)"/>
  <g fill="none" stroke="url(#acc)" stroke-opacity="0.5" stroke-width="2">
    <path d="M70 120 L220 200 L180 330"/><path d="M730 100 L590 190 L640 320"/>
    <path d="M90 520 L240 440"/><path d="M720 540 L570 450"/>
  </g>
  <g fill="#04140a" stroke="url(#acc)" stroke-width="3">
    <circle cx="70" cy="120" r="9"/><circle cx="220" cy="200" r="9"/><circle cx="180" cy="330" r="9"/>
    <circle cx="730" cy="100" r="9"/><circle cx="590" cy="190" r="9"/><circle cx="640" cy="320" r="9"/>
    <circle cx="90" cy="520" r="9"/><circle cx="240" cy="440" r="9"/>
    <circle cx="720" cy="540" r="9"/><circle cx="570" cy="450" r="9"/>
  </g>
  <!-- shield -->
  <path d="M400 90 L560 150 V290 C560 390 490 455 400 495 C310 455 240 390 240 290 V150 Z" fill="#04140a" fill-opacity="0.85" stroke="url(#acc)" stroke-width="6"/>
  <path d="M400 118 L536 168 V290 C536 372 477 431 400 466 C323 431 264 372 264 290 V168 Z" fill="none" stroke="#2cd626" stroke-opacity="0.25" stroke-width="2"/>
  <!-- lock -->
  <rect x="352" y="272" width="96" height="78" rx="12" fill="url(#acc)"/>
  <path d="M370 272 V248 C370 226 430 226 430 248 V272" fill="none" stroke="url(#acc)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="400" cy="305" r="9" fill="#04140a"/><rect x="396" y="308" width="8" height="24" rx="4" fill="#04140a"/>
  <g font-family="Poppins, Arial, sans-serif" text-anchor="middle">
    <text x="400" y="560" font-size="34" font-weight="700" fill="#ffffff">NEOKRED</text>
    <text x="400" y="598" font-size="19" letter-spacing="5" fill="#19e3c5">VAPT  |  FINTECH SECURITY</text>
  </g>
</svg>
